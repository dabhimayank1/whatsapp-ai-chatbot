<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chat History - {{ session_id }}</title>
<style>
  body { font-family: Arial, sans-serif; background: #ece5dd; padding: 30px; }
  .back { color: #075e54; text-decoration: none; font-weight: 600; }
  h2 { color: #075e54; }
  .msg { max-width: 60%; padding: 10px 14px; border-radius: 8px; margin-bottom: 10px; }
  .user { background: #dcf8c6; margin-left: auto; }
  .bot { background: white; }
  .escalated { border-left: 4px solid #e53935; }
  .time { font-size: 11px; color: #888; margin-top: 4px; }
  form { margin-top: 20px; }
  button { background: #075e54; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
  <a class="back" href="/admin">← Back to all sessions</a>
  <h2>Chat with: {{ session_id }}</h2>

  {% for m in messages %}
    <div class="msg {{ m.sender }} {% if m.escalated %}escalated{% endif %}">
      <div>{{ m.message }}</div>
      <div class="time">{{ m.sender }} • {{ m.created_at }}</div>
    </div>
  {% endfor %}

  <form method="post" action="/admin/{{ session_id }}/resolve">
    <button type="submit">✅ Mark as Resolved (bot takes over again)</button>
  </form>
</body>
</html>
