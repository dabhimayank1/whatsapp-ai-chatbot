<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — SocialToSales</title>
<style>
  :root{--bg:#f5f4f7;--card:#fff;--line:#dcd7e2;--ink:#1a1620;--muted:#6b6377;
        --accent:#0f7a41;--err:#b83227;}
  @media (prefers-color-scheme:dark){
    :root{--bg:#131117;--card:#1b181f;--line:#322d3a;--ink:#ece8f0;
          --muted:#9a92a6;--accent:#4ec883;--err:#f0776a;}
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       background:var(--bg);color:var(--ink);
       font:15px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:34px;max-width:380px;width:100%;}
  h1{font-size:1.3rem;margin:0 0 4px;letter-spacing:-.02em;}
  .sub{color:var(--muted);font-size:.86rem;margin:0 0 24px;}
  label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:5px;}
  input{width:100%;padding:10px 12px;border-radius:9px;font-size:15px;
        border:1px solid var(--line);background:var(--bg);color:var(--ink);
        margin-bottom:15px;font-family:inherit;}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  button{width:100%;padding:11px;border-radius:9px;border:none;
         background:var(--accent);color:#03210f;font-weight:650;font-size:15px;
         cursor:pointer;font-family:inherit;}
  button:hover{filter:brightness(1.07);}
  .err{background:rgba(184,50,39,.12);color:var(--err);padding:10px 12px;
       border-radius:8px;font-size:.85rem;margin-bottom:16px;}
  .hint{margin-top:20px;font-size:.76rem;color:var(--muted);line-height:1.5;}
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>SocialToSales</h1>
    <p class="sub">Reels → WhatsApp → CRM</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" required autofocus>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <p class="hint">Influencers: use the login your account manager gave you.
      You'll only ever see your own leads.</p>
  </form>
</body>
</html>
