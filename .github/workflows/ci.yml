# The isolation guarantee in the README was broken for several commits and
# nothing said so. That is what this file is for.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.5 is the floor: node:sqlite does not exist before it.
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Funnel suite
        run: npm run test:funnel

      - name: Multi-tenant isolation suite
        run: npm run test:multitenant

      - name: Security, consent and privacy suite
        run: npm run test:security

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse committed secrets
        run: |
          # .env and the database hold live credentials and customer data.
          # They are gitignored; this fails the build if that ever slips.
          for forbidden in .env chatbot.db crm_export.csv; do
            if git ls-files --error-unmatch "$forbidden" >/dev/null 2>&1; then
              echo "::error::$forbidden is tracked in git and must not be"
              exit 1
            fi
          done

      - name: Refuse hardcoded verify tokens
        run: |
          # These strings ship in .env.example, so accepting them in code makes
          # the webhook handshake public. See the note in webhooksIg.js.
          if grep -rn --include="*.js" \
               -e 'my-secret-ig-token' -e 'my-secret-verify-token' src/; then
            echo "::error::a placeholder verify token is accepted in src/"
            exit 1
          fi
